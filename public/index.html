<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pproxy</title>
<style>
:root {
    --bg: #000; --panel: #0b0b0b; --line: #1f1f1f; --line2: #2c2c2c;
    --fg: #ececec; --dim: #8a8a8a; --faint: #555;
    --accent: #ffb224; --bad: #ff5d5d; --ok: #6fd18a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 var(--mono); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 1.5rem; padding: 1.1rem 2rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -.02em; font-size: 1.05rem; }
.brand span { color: var(--accent); }
.endpoint { color: var(--dim); display: flex; gap: .5rem; align-items: center; cursor: pointer; border: 0; background: none; padding: 0; }
.endpoint b { color: var(--fg); font-weight: 400; }
.endpoint:hover b { color: var(--accent); }
.spacer { flex: 1; }
.summary { color: var(--dim); }
.summary b { color: var(--fg); font-weight: 400; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 0; min-height: calc(100vh - 62px); }
section { padding: 1.5rem 2rem; border-bottom: 1px solid var(--line); }
aside { border-left: 1px solid var(--line); }
aside section { padding: 1.5rem; }
h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin: 0 0 1rem; display: flex; align-items: center; gap: 1rem; }
h2 .spacer { flex: 1; }

.btn { background: none; border: 1px solid var(--line2); padding: .35rem .8rem; cursor: pointer; border-radius: 2px; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.small { padding: .1rem .5rem; font-size: .8rem; }
.btn.ghost { border-color: transparent; color: var(--dim); }
.btn.ghost:hover { color: var(--bad); border-color: transparent; }

.acct { display: grid; grid-template-columns: 1.4rem minmax(9rem, 1.2fr) minmax(10rem, 2fr) 5rem 5rem 4.5rem auto; gap: 1rem; align-items: center; padding: .85rem 0; border-top: 1px solid var(--line); }
.acct:first-of-type { border-top: 0; }
.acct.off { opacity: .45; }
.acct .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .id { color: var(--faint); font-size: .75rem; display: block; overflow: hidden; text-overflow: ellipsis; }
.acct .num { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.acct .num b { color: var(--fg); font-weight: 400; }
.acct .err { grid-column: 2 / -1; color: var(--bad); font-size: .8rem; margin-top: -.4rem; }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ok); }
.dot.busy { background: var(--accent); box-shadow: 0 0 0 3px rgba(255,178,36,.18); }
.dot.bad { background: var(--bad); }
.dot.off { background: var(--faint); }
.bar { height: 4px; background: var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--fg); }
.bar.low i { background: var(--bad); }
.credit { font-size: .78rem; color: var(--dim); margin-top: .3rem; font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: 1.4rem minmax(9rem, 1.2fr) minmax(10rem, 2fr) 5rem 5rem 4.5rem auto; gap: 1rem; color: var(--faint); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; padding-bottom: .4rem; }
.cols .r { text-align: right; }
.weight { width: 3.2rem; background: none; border: 1px solid var(--line2); padding: .1rem .3rem; text-align: right; }
.toggle { cursor: pointer; }

.empty { padding: 2.5rem 0; color: var(--dim); max-width: 34rem; }
.empty p { margin: 0 0 1rem; }

.link { margin-top: 1rem; padding: 1rem; border: 1px dashed var(--line2); color: var(--dim); }
.link code { color: var(--fg); word-break: break-all; display: block; margin: .5rem 0; font-size: .8rem; }

.strats { display: flex; flex-direction: column; gap: 1px; }
.strat { display: grid; grid-template-columns: 1rem 1fr; gap: .7rem; padding: .6rem .7rem; cursor: pointer; border: 1px solid transparent; }
.strat:hover { background: var(--panel); }
.strat input { accent-color: var(--accent); margin: .25rem 0 0; }
.strat.on { border-color: var(--line2); background: var(--panel); }
.strat b { font-weight: 500; display: block; }
.strat.on b { color: var(--accent); }
.strat span { color: var(--dim); font-size: .8rem; }
.check { display: flex; gap: .6rem; align-items: center; margin-top: 1rem; color: var(--dim); cursor: pointer; }
.check input { accent-color: var(--accent); }

label.field { display: block; color: var(--dim); font-size: .8rem; margin-bottom: .9rem; }
label.field input { display: block; width: 100%; margin-top: .3rem; background: var(--panel); border: 1px solid var(--line2); padding: .4rem .5rem; }
.map { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: .4rem; align-items: center; margin-bottom: .4rem; }
.map input { min-width: 0; background: var(--panel); border: 1px solid var(--line2); padding: .3rem .4rem; font-size: .8rem; }
.map span { color: var(--faint); }
.hint { color: var(--faint); font-size: .75rem; margin: .4rem 0 0; }

table { width: 100%; border-collapse: collapse; font-size: .8rem; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--faint); font-weight: 400; text-transform: uppercase; letter-spacing: .08em; font-size: .7rem; padding: 0 .8rem .5rem 0; }
td { padding: .35rem .8rem .35rem 0; border-top: 1px solid var(--line); white-space: nowrap; color: var(--dim); }
td.fg { color: var(--fg); }
td.bad { color: var(--bad); }
td.r, th.r { text-align: right; }
td.trunc { max-width: 18rem; overflow: hidden; text-overflow: ellipsis; }

.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--fg); color: #000; padding: .5rem 1rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
    aside { border-left: 0; }
    .acct, .cols { grid-template-columns: 1.4rem 1fr 1fr auto; }
    .acct .num, .cols .r { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
    <div class="brand">p<span>/</span>proxy</div>
    <button class="endpoint" id="endpoint" title="Copy base URL">base url <b id="base"></b></button>
    <div class="spacer"></div>
    <div class="summary" id="summary"></div>
</header>
<main>
    <div>
        <section>
            <h2>Accounts <span class="spacer"></span>
                <button class="btn small" id="refresh" title="Re-fetch monthly usage from Puter">refresh usage</button>
                <button class="btn primary" id="add">Add account</button>
            </h2>
            <div id="accounts"></div>
            <div id="link"></div>
        </section>
        <section>
            <h2>Recent requests</h2>
            <div id="log"></div>
        </section>
    </div>
    <aside>
        <section>
            <h2>Routing</h2>
            <div class="strats" id="strats"></div>
            <label class="check"><input type="checkbox" id="failover"> retry on another account when one is out of credit or rate limited</label>
        </section>
        <section>
            <h2>Models</h2>
            <label class="field">used when a request names no model<input id="defaultModel" spellcheck="false"></label>
            <div id="maps"></div>
            <button class="btn small" id="addMap">+ alias</button>
            <p class="hint">Map names your client sends to Puter model ids. <code>*</code> matches anything, e.g. <code>claude-*</code>.</p>
        </section>
        <section>
            <h2>Access</h2>
            <label class="field">API key clients must send (blank = none)<input id="apiKey" type="password" placeholder="" autocomplete="off"></label>
            <p class="hint" id="keyHint"></p>
        </section>
    </aside>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const credit = (v, unit) => v == null ? '?' : unit === 'microcents' ? '$' + (v / 1e8).toFixed(2) : (Math.round(v * 10) / 10).toLocaleString();
const compact = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const ago = (t) => { if (!t) return 'never'; const s = (Date.now() - t) / 1000; return s < 60 ? Math.round(s) + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago'; };
const base = location.origin;
let key = localStorage.getItem('pproxy-key') || '';
let settings = null;

function toast (msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function api (method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (key) headers.Authorization = 'Bearer ' + key;
    const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) {
        const k = prompt('This pproxy needs its API key');
        if (k) { key = k; localStorage.setItem('pproxy-key', k); return api(method, path, body); }
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data?.error?.message || 'HTTP ' + r.status);
    return data;
}

function renderAccounts (list) {
    const el = $('accounts');
    if (!list.length) {
        el.innerHTML = `<div class="empty"><p>No accounts yet. Each Puter account you sign in with adds its monthly credit to the pool.</p><p>Point any OpenAI or Anthropic client at <b>${esc(base)}/v1</b> once one is added.</p></div>`;
        return;
    }
    el.innerHTML = `<div class="cols"><span></span><span>account</span><span>monthly credit</span><span class="r">requests</span><span class="r">tokens</span><span class="r">weight</span><span></span></div>` + list.map(a => {
        const u = a.usage;
        const pct = u && u.allowance ? Math.max(0, Math.min(100, 100 * u.remaining / u.allowance)) : 0;
        const dot = !a.enabled ? 'off' : a.status !== 'ok' ? 'bad' : a.inflight ? 'busy' : '';
        const title = !a.enabled ? 'disabled' : a.status !== 'ok' ? a.status : a.inflight ? a.inflight + ' in flight' : 'ready';
        return `<div class="acct ${a.enabled ? '' : 'off'}" data-id="${esc(a.id)}">
            <div class="dot ${dot}" title="${esc(title)}"></div>
            <div class="name">${esc(a.username)}<span class="id" title="Puter user id">${esc(a.id)}</span></div>
            <div><div class="bar ${pct < 10 ? 'low' : ''}"><i style="width:${pct}%"></i></div>
                <div class="credit">${u ? `${credit(u.remaining, u.unit)} of ${credit(u.allowance, u.unit)}${u.unit && u.unit !== 'microcents' ? ' ' + esc(u.unit) : ''} left` : 'usage unknown'} · used ${ago(a.lastUsed)}</div></div>
            <div class="num"><b>${a.stats.requests}</b>${a.stats.errors ? ` <span title="errors">/${a.stats.errors}</span>` : ''}</div>
            <div class="num">${a.stats.inputTokens + a.stats.outputTokens ? compact(a.stats.inputTokens + a.stats.outputTokens) : '—'}</div>
            <div class="num"><input class="weight" type="number" min="0" step="1" value="${a.weight}" title="Weight for the random strategy"></div>
            <div><button class="btn small toggle">${a.enabled ? 'disable' : 'enable'}</button> <button class="btn small ghost remove" title="Remove">✕</button></div>
            ${a.lastError && a.status !== 'ok' ? `<div class="err">${esc(a.lastError)}</div>` : ''}
        </div>`;
    }).join('');
}

function renderLog (log) {
    if (!log.length) { $('log').innerHTML = '<p class="hint">Nothing yet.</p>'; return; }
    $('log').innerHTML = `<table><tr><th>time</th><th>api</th><th>model</th><th>account</th><th class="r">in</th><th class="r">out</th><th class="r">ms</th><th>status</th></tr>` +
        log.slice(0, 40).map(e => `<tr>
            <td>${new Date(e.time).toLocaleTimeString()}</td><td>${esc(e.format)}${e.stream ? ' ~' : ''}</td>
            <td class="fg trunc" title="${esc(e.model)} → ${esc(e.puterModel)}">${esc(e.puterModel || e.model)}</td>
            <td>${esc(e.account || '—')}</td><td class="r">${e.input ?? ''}</td><td class="r">${e.output ?? ''}</td><td class="r">${e.ms}</td>
            <td class="${e.status >= 400 ? 'bad trunc' : ''}" title="${esc(e.error || '')}">${e.status}${e.error ? ' ' + esc(e.error) : ''}</td></tr>`).join('') + '</table>';
}

function renderSettings () {
    const s = settings;
    $('strats').innerHTML = Object.entries(s.strategies).map(([k, d]) => `<label class="strat ${k === s.strategy ? 'on' : ''}">
        <input type="radio" name="strategy" value="${k}" ${k === s.strategy ? 'checked' : ''}><div><b>${k}</b><span>${esc(d)}</span></div></label>`).join('');
    $('failover').checked = s.failover;
    if (document.activeElement !== $('defaultModel')) $('defaultModel').value = s.defaultModel;
    renderMaps();
    $('apiKey').placeholder = s.apiKeySet ? '•••••••• (set)' : 'none';
    $('keyHint').textContent = s.apiKeySet ? 'Clients send it as a Bearer token or x-api-key.' : (['127.0.0.1', 'localhost', '::1'].includes(s.host) ? 'Only this machine can reach the server.' : 'Listening beyond localhost with no key.');
}

function renderMaps () {
    const entries = Object.entries(settings.modelMap || {});
    $('maps').innerHTML = entries.map(([f, t], i) => `<div class="map" data-i="${i}"><input value="${esc(f)}" placeholder="client name" spellcheck="false"><span>→</span><input value="${esc(t)}" placeholder="puter model" spellcheck="false"><button class="btn small ghost" title="Remove">✕</button></div>`).join('');
}

function readMaps () {
    const map = {};
    for (const row of $('maps').querySelectorAll('.map')) {
        const [f, t] = row.querySelectorAll('input');
        if (f.value.trim() && t.value.trim()) map[f.value.trim()] = t.value.trim();
    }
    return map;
}

async function saveSettings (patch, msg) {
    try { settings = await api('PATCH', '/api/settings', patch); renderSettings(); if (msg) toast(msg); }
    catch (e) { toast(e.message); }
}

async function tick () {
    try {
        const [accounts, log, status] = await Promise.all([api('GET', '/api/accounts'), api('GET', '/api/log'), api('GET', '/api/status')]);
        if (!document.querySelector('.acct input:focus')) renderAccounts(accounts);
        renderLog(log);
        $('summary').innerHTML = `<b>${status.usable}</b>/${status.accounts} usable · v${esc(status.version)}`;
    } catch (e) { $('summary').textContent = e.message; }
}

async function addAccount () {
    try {
        const { state, url } = await api('POST', '/api/link', { base });
        window.open(url, '_blank');
        $('link').innerHTML = `<div class="link">Waiting for Puter sign-in in the new tab. If it didn't open:<code>${esc(url)}</code><button class="btn small" id="copyLink">copy link</button></div>`;
        $('copyLink').onclick = () => { navigator.clipboard.writeText(url); toast('Link copied'); };
        const end = Date.now() + 15 * 60 * 1000;
        while (Date.now() < end) {
            await new Promise(r => setTimeout(r, 1500));
            const l = await api('GET', '/api/link/' + state);
            if (l.status === 'done') { $('link').innerHTML = ''; toast('Added ' + l.account.username); tick(); return; }
            if (l.status === 'error') { $('link').innerHTML = `<div class="link" style="color:var(--bad)">${esc(l.error)}</div>`; return; }
        }
        $('link').innerHTML = '';
    } catch (e) { toast(e.message); }
}

$('base').textContent = base + '/v1';
$('endpoint').onclick = () => { navigator.clipboard.writeText(base + '/v1'); toast('Copied ' + base + '/v1'); };
$('add').onclick = addAccount;
$('refresh').onclick = async () => { try { renderAccounts(await api('POST', '/api/accounts/refresh')); toast('Usage refreshed'); } catch (e) { toast(e.message); } };
$('accounts').addEventListener('click', async (ev) => {
    const row = ev.target.closest('.acct'); if (!row) return;
    const id = row.dataset.id;
    try {
        if (ev.target.classList.contains('toggle')) { await api('PATCH', '/api/accounts/' + id, { enabled: ev.target.textContent === 'enable' }); tick(); }
        if (ev.target.classList.contains('remove') && confirm('Remove this account from the pool?')) { await api('DELETE', '/api/accounts/' + id); tick(); }
    } catch (e) { toast(e.message); }
});
$('accounts').addEventListener('change', async (ev) => {
    if (!ev.target.classList.contains('weight')) return;
    const id = ev.target.closest('.acct').dataset.id;
    try { await api('PATCH', '/api/accounts/' + id, { weight: Number(ev.target.value) }); toast('Weight saved'); } catch (e) { toast(e.message); }
});
$('strats').addEventListener('change', (ev) => saveSettings({ strategy: ev.target.value }, 'Routing: ' + ev.target.value));
$('failover').onchange = (ev) => saveSettings({ failover: ev.target.checked }, ev.target.checked ? 'Failover on' : 'Failover off');
$('defaultModel').onchange = (ev) => saveSettings({ defaultModel: ev.target.value.trim() }, 'Default model saved');
$('addMap').onclick = () => { settings.modelMap = { ...readMaps(), '': '' }; renderMaps(); $('maps').lastElementChild?.querySelector('input').focus(); };
$('maps').addEventListener('change', () => saveSettings({ modelMap: readMaps() }, 'Aliases saved'));
$('maps').addEventListener('click', (ev) => { if (ev.target.tagName === 'BUTTON') { ev.target.closest('.map').remove(); saveSettings({ modelMap: readMaps() }, 'Alias removed'); } });
$('apiKey').onchange = (ev) => { const v = ev.target.value; ev.target.value = ''; key = v; if (v) localStorage.setItem('pproxy-key', v); else localStorage.removeItem('pproxy-key'); saveSettings({ apiKey: v }, v ? 'API key set' : 'API key cleared'); };

(async () => {
    try { settings = await api('GET', '/api/settings'); renderSettings(); } catch (e) { toast(e.message); }
    tick();
    setInterval(tick, 3000);
})();
</script>
</body>
</html>
